  - id: 737:304
    description: 'Contenedor desktop de pantalla: Header y Sidebar locales, más Slot
      Content vacío para contenido variable. Baseline1440×1024, sin breakpoints móviles
      definidos. Configura Header/Sidebar expuestos y añade contenido en la instancia
      sin detach. Consume tokens semánticos del JSON canónico; APP-SHELL-0010.1.0.
      QA y auditoría humana se registran por separado.'
  - id: 518:123
    description: Cabecera de escritorio con identidad de categoría, versión, acciones
      variables, empresa y perfil. Actions es Slot nativo 0..n; cuatro textos editables
      y Avatar expuesto. Roles semánticos por tema; logos agnósticos. HEADER-001 v0.1.0.
      Navegación y responsive móvil no definidos.
