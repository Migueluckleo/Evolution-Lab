component:
  id: "8203:10"
  key: 3dd9fbbf8292626139175771f3701b5bc442a952
  name: Filter Chip
  type: COMPONENT_SET
  description: "Filter chip / segmented toggle pill. Used to switch between a small set of filters (e.g. Todos / Pendientes / Requieren atencion). Variant axes: Size (Sm/Md/Xl - padding, font size and icon size scale, matching the Button component's spacing scale), Selected (True/False - is this chip the active filter), State (Default/Hover/Press/Focus/Disabled - interaction state, independent of Selected so a selected chip can still show hover/press/focus). Properties: Text (chip label), Show left icon / Show right icon (booleans, default off - reference usage is text-only), Left icon / Right icon (instance-swap, default PlusCircle - swap for any icon component). All colors bound to semantic tokens (color/interactive/secondary/*, color/background/inverse, color/text/*, color/focus/ring) so the chip themes correctly across all 4 product modes (Contable/Administrativo/Servicios/Personas). Selected+Hover and Selected+Press reuse color/background/inverse at reduced opacity (92%/85%) since the library has no dedicated inverse/hover or inverse/active token yet. Disabled looks the same whether or not the chip is Selected, matching the Button component's pattern."
  parent: {id: "8194:4998", name: Frame 2, type: FRAME}
  page: {id: "7339:129", name: WIP Chips}
  source:
    url: "https://www.figma.com/design/9zs5RMR8LB5wHjW9Bd59BA/Libreria-v1.1.0?node-id=8203-10&t=sZOrF8YSnEjHSpdU-11"
